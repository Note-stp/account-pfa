<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACCOUNT PFA</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: #fff;
    }

    .header {
      background: #06c755;
      color: white;
      padding: 18px 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .content {
      padding: 18px;
    }

    .section {
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card {
      background: #f8f9fa;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 16px;
      border-radius: 12px;
      padding: 12px;
    }

    .item-button {
      flex: 1;
      background: white;
      border: 1px solid #ddd;
      text-align: left;
    }

    .item-button.selected {
      background: #e8f8ee;
      border: 2px solid #06c755;
    }

    .amount {
      width: 120px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      text-align: right;
    }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .member {
      background: white;
      border: 1px solid #ddd;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
    }

    .member.selected {
      background: #e8f8ee;
      border: 2px solid #06c755;
      color: #087f3d;
    }

    .member-amount {
      margin-top: 8px;
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: right;
      font-size: 15px;
    }

    .total {
      background: #eefbf3;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
    }

    .submit {
      width: 100%;
      background: #06c755;
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 16px;
      margin-top: 18px;
    }

    .submit:active {
      transform: scale(.98);
    }

    .note {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    ACCOUNT PFA
  </div>

  <div class="content">

    <!-- รายการ -->
    <div class="section">

      <div class="section-title">
        1. รายการค่าใช้จ่าย
      </div>

      <div id="expenseList">

        <div class="card expense-row">

          <div class="row">

            <button
              class="item-button"
              onclick="selectExpense(this, 'ค่าน้ำมัน')">
              ⛽ ค่าน้ำมัน
            </button>

            <input
              class="amount expense-amount"
              type="number"
              placeholder="บาท"
              min="0"
              oninput="calculateTotal()">

          </div>

        </div>

      </div>

      <button
        onclick="addExpense()"
        style="width:100%;background:#f1f3f5;margin-top:5px;">
        ➕ เพิ่มรายการ
      </button>

    </div>


    <!-- สมาชิกทีม -->
    <div class="section">

      <div class="section-title">
        2. ค่าทีม
      </div>

      <div class="note">
        เลือกสมาชิกที่ต้องการบันทึกค่าใช้จ่าย
      </div>

      <div class="member-grid">

        <div class="card">

          <button
            class="member"
            onclick="selectMember(this, 'Phet')">
            👤 Phet
          </button>

          <input
            class="member-amount hidden"
            type="number"
            placeholder="จำนวนเงิน"
            min="0"
            oninput="calculateTotal()">

        </div>


        <div class="card">

          <button
            class="member"
            onclick="selectMember(this, 'Member 2')">
            👤 Member 2
          </button>

          <input
            class="member-amount hidden"
            type="number"
            placeholder="จำนวนเงิน"
            min="0"
            oninput="calculateTotal()">

        </div>


        <div class="card">

          <button
            class="member"
            onclick="selectMember(this, 'Member 3')">
            👤 Member 3
          </button>

          <input
            class="member-amount hidden"
            type="number"
            placeholder="จำนวนเงิน"
            min="0"
            oninput="calculateTotal()">

        </div>


        <div class="card">

          <button
            class="member"
            onclick="selectMember(this, 'Member 4')">
            👤 Member 4
          </button>

          <input
            class="member-amount hidden"
            type="number"
            placeholder="จำนวนเงิน"
            min="0"
            oninput="calculateTotal()">

        </div>

      </div>

    </div>


    <!-- สรุป -->
    <div class="section">

      <div class="section-title">
        3. สรุปรายการ
      </div>

      <div class="total">
        <span>ยอดรวม</span>
        <span>
          <span id="total">0</span> บาท
        </span>
      </div>

    </div>


    <!-- บันทึก -->
    <button
      class="submit"
      onclick="submitData()">
      ✅ บันทึกข้อมูล
    </button>

  </div>

</div>


<script>

  let expenseCount = 1;


  // เลือกรายการ
  function selectExpense(button, name) {

    button.classList.toggle("selected");

  }


  // เพิ่มรายการ
  function addExpense() {

    expenseCount++;

    const container =
      document.getElementById("expenseList");

    const div =
      document.createElement("div");

    div.className = "card expense-row";

    div.innerHTML = `

      <div class="row">

        <button
          class="item-button"
          onclick="selectExpense(this, 'รายการ ${expenseCount}')">

          📋 รายการ ${expenseCount}

        </button>

        <input
          class="amount expense-amount"
          type="number"
          placeholder="บาท"
          min="0"
          oninput="calculateTotal()">

      </div>

    `;

    container.appendChild(div);

  }


  // เลือกสมาชิก
  function selectMember(button, name) {

    button.classList.toggle("selected");

    const input =
      button.parentElement.querySelector(".member-amount");

    if (button.classList.contains("selected")) {

      input.classList.remove("hidden");

    } else {

      input.classList.add("hidden");
      input.value = "";

    }

    calculateTotal();

  }


  // คำนวณยอดรวม
  function calculateTotal() {

    let total = 0;


    // ค่าใช้จ่าย
    document
      .querySelectorAll(".expense-amount")
      .forEach(input => {

        total += Number(input.value) || 0;

      });


    // ค่าทีม
    document
      .querySelectorAll(".member-amount")
      .forEach(input => {

        if (!input.classList.contains("hidden")) {

          total += Number(input.value) || 0;

        }

      });


    document.getElementById("total").innerText =
      total.toLocaleString("th-TH");

  }


  // ส่งข้อมูล
  function submitData() {

    const expenses = [];

    document
      .querySelectorAll(".expense-row")
      .forEach(row => {

        const button =
          row.querySelector(".item-button");

        const amount =
          row.querySelector(".expense-amount");

        if (
          button &&
          button.classList.contains("selected") &&
          amount.value
        ) {

          expenses.push({

            item: button.innerText.trim(),

            amount: Number(amount.value)

          });

        }

      });


    const members = [];

    document
      .querySelectorAll(".member")
      .forEach(button => {

        if (button.classList.contains("selected")) {

          const input =
            button.parentElement
              .querySelector(".member-amount");

          members.push({

            name: button.innerText.trim(),

            amount: Number(input.value) || 0

          });

        }

      });


    const data = {

      expenses: expenses,

      members: members,

      total:
        Number(
          document
            .getElementById("total")
            .innerText
            .replace(/,/g, "")
        ),

      timestamp:
        new Date().toISOString()

    };


    console.log(data);


    alert(
      "บันทึกข้อมูลเรียบร้อยแล้ว\n\n" +
      "ยอดรวม " +
      data.total.toLocaleString("th-TH") +
      " บาท"
    );

  }

</script>

</body>
</html>
