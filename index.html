  <!-- =========================================

<script>


/*************************************************
 * CONFIG
 *************************************************/


const LIFF_ID =
  "2011289699-I5WMsObs";


const WORKER_URL =
  "https://line-accounting-bot.notza1982.workers.dev/";


/*************************************************
 * VARIABLES
 *************************************************/


let lineUser = {

  userId: "",

  name: ""

};


let selectedRound =
  null;


let selectedMembers =
  [];


/*************************************************
 * SHOW MESSAGE
 *************************************************/


function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.textContent =
    text;


  box.className =
    "message " + type;


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/*************************************************
 * FORMAT MONEY
 *************************************************/


function formatMoney(
  value
) {

  return Number(
    value || 0
  ).toLocaleString(

    "th-TH",

    {

      minimumFractionDigits:
        2,

      maximumFractionDigits:
        2

    }

  );

}


/*************************************************
 * LIFF INIT
 *************************************************/


async function initLIFF() {

  const name =
    document.getElementById(
      "userName"
    );


  const status =
    document.getElementById(
      "userStatus"
    );


  try {

    name.textContent =
      "กำลังเข้าสู่ระบบ LINE...";


    status.textContent =
      "กำลังตรวจสอบ LIFF";


    if (
      typeof liff ===
      "undefined"
    ) {

      throw new Error(
        "ไม่พบ LINE LIFF SDK"
      );

    }


    await liff.init({

      liffId:
        LIFF_ID

    });


    /*
     * ถ้าเปิดจากภายนอก LINE
     * และยังไม่ได้ Login
     */

    if (
      !liff.isLoggedIn()
    ) {

      status.textContent =
        "กำลังเข้าสู่ระบบ LINE...";


      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    lineUser.userId =
      profile.userId || "";


    lineUser.name =
      profile.displayName || "";


    name.textContent =
      "👤 " +
      lineUser.name;


    status.textContent =
      "เชื่อมต่อ LINE สำเร็จ";


    console.log(
      "LINE USER:",
      lineUser
    );


  }

  catch (error) {

    console.error(
      "LIFF ERROR:",
      error
    );


    name.textContent =
      "❌ เชื่อมต่อ LINE ไม่สำเร็จ";


    status.textContent =
      error.message ||
      String(error);


  }

}


/*************************************************
 * ROUND BUTTON
 *************************************************/


document
  .querySelectorAll(
    ".round-btn"
  )
  .forEach(

    function(button) {

      button.addEventListener(

        "click",

        function() {


          /*
           * ล้าง active ทุกปุ่ม
           */

          document
            .querySelectorAll(
              ".round-btn"
            )
            .forEach(

              function(btn) {

                btn.classList.remove(
                  "active"
                );

              }

            );


          /*
           * Active ปุ่มที่เลือก
           */

          button.classList.add(
            "active"
          );


          /*
           * เก็บครั้งที่
           */

          selectedRound =
            Number(
              button.dataset.round
            );


          /*
           * แสดงข้อความ
           */

          document
            .getElementById(
              "selectedRoundText"
            )
            .textContent =
            "เลือกครั้งที่ " +
            selectedRound;


          console.log(
            "SELECTED ROUND:",
            selectedRound
          );


        }

      );

    }

  );


/*************************************************
 * MEMBER BUTTON
 *************************************************/


document
  .querySelectorAll(
    ".member-btn"
  )
  .forEach(

    function(button) {

      button.addEventListener(

        "click",

        function() {


          const member =
            button.dataset.member;


          /*
           * ถ้าเลือกอยู่แล้ว = ยกเลิก
           */

          if (
            selectedMembers
              .includes(member)
          ) {


            selectedMembers =
              selectedMembers.filter(

                function(name) {

                  return name !== member;

                }

              );


            button.classList.remove(
              "active"
            );


            const element =
              document.getElementById(
                "team-" + member
              );


            if (element) {

              element.remove();

            }


            updateTotals();


            return;

          }


          /*
           * จำกัดสูงสุด 4 คน
           */

          if (
            selectedMembers.length >= 4
          ) {

            showMessage(

              "เลือกสมาชิกได้สูงสุด 4 คน",

              "error"

            );


            return;

          }


          /*
           * เพิ่มสมาชิก
           */

          selectedMembers.push(
            member
          );


          button.classList.add(
            "active"
          );


          addTeamMember(
            member
          );


          updateTotals();

        }

      );

    }

  );


/*************************************************
 * ADD TEAM MEMBER
 *************************************************/


function addTeamMember(
  member
) {


  const container =
    document.getElementById(
      "teamContainer"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "team-member";


  div.id =
    "team-" + member;


  div.innerHTML = `

    <div class="team-member-name">

      👤 ${member}

    </div>


    <input

      type="number"

      class="team-amount"

      data-member="${member}"

      placeholder="จำนวนเงินของ ${member}"

      min="0"

      step="0.01"

      inputmode="decimal"

    >

  `;


  container.appendChild(
    div
  );


  const input =
    div.querySelector(
      ".team-amount"
    );


  input.addEventListener(

    "input",

    updateTotals

  );

}


/*************************************************
 * UPDATE TOTAL
 *************************************************/


function updateTotals() {


  let teamTotal =
    0;


  document
    .querySelectorAll(
      ".team-amount"
    )
    .forEach(

      function(input) {

        teamTotal +=
          Number(
            input.value
          ) || 0;

      }

    );


  const amount =
    Number(

      document
        .getElementById(
          "amount"
        )
        .value

    ) || 0;


  const total =
    amount +
    teamTotal;


  document
    .getElementById(
      "teamTotalValue"
    )
    .textContent =
    formatMoney(
      teamTotal
    );


  document
    .getElementById(
      "grandTotal"
    )
    .textContent =
    formatMoney(
      total
    );


  const teamBox =
    document.getElementById(
      "teamTotal"
    );


  if (
    selectedMembers.length > 0
  ) {

    teamBox.classList.remove(
      "hidden"
    );

  }

  else {

    teamBox.classList.add(
      "hidden"
    );

  }

}


/*************************************************
 * AMOUNT INPUT
 *************************************************/


document
  .getElementById(
    "amount"
  )
  .addEventListener(

    "input",

    updateTotals

  );


/*************************************************
 * SAVE BUTTON
 *************************************************/


document
  .getElementById(
    "saveBtn"
  )
  .addEventListener(

    "click",

    saveTransaction

  );


/*************************************************
 * SAVE TRANSACTION
 *************************************************/


async function saveTransaction() {


  const button =
    document.getElementById(
      "saveBtn"
    );


  /*
   * ข้อมูลรายการ
   */

  const item =
    document
      .getElementById(
        "item"
      )
      .value
      .trim();


  /*
   * จำนวนเงินหลัก
   */

  const amount =
    Number(

      document
        .getElementById(
          "amount"
        )
        .value

    );


  /*
   * ตรวจ LINE Login
   */

  if (
    !lineUser.userId
  ) {

    showMessage(

      "กรุณารอให้ LINE Login เสร็จก่อน",

      "error"

    );


    return;

  }


  /*
   * ตรวจรายการ
   */

  if (!item) {

    showMessage(

      "กรุณาระบุรายการ",

      "error"

    );


    return;

  }


  /*
   * ตรวจครั้งที่
   */

  if (
    !selectedRound
  ) {

    showMessage(

      "กรุณาเลือกครั้งที่ 1–5",

      "error"

    );


    return;

  }


  /*
   * ตรวจจำนวนเงิน
   */

  if (
    isNaN(amount) ||
    amount < 0
  ) {

    showMessage(

      "กรุณาระบุจำนวนเงินให้ถูกต้อง",

      "error"

    );


    return;

  }


  /*
   * สมาชิกทีม
   */

  const team = [];


  document
    .querySelectorAll(
      ".team-amount"
    )
    .forEach(

      function(input) {

        team.push({

          name:
            input.dataset.member,

          amount:
            Number(
              input.value
            ) || 0

        });

      }

    );


  /*
   * คำนวณยอดรวม
   */

  let teamTotal =
    0;


  team.forEach(

    function(member) {

      teamTotal +=
        Number(
          member.amount
        ) || 0;

    }

  );


  const total =
    amount +
    teamTotal;


  /*
   * ข้อมูลที่จะส่ง
   */

  const data = {

    type:
      "LIFF_EXPENSE",


    userId:
      lineUser.userId,


    displayName:
      lineUser.name,


    name:
      lineUser.name,


    item:
      item,


    round:
      selectedRound,


    amount:
      amount,


    team:
      team,


    /*
     * ส่งเป็น expenses
     * เพื่อรองรับ Backend
     */

    expenses: [

      {

        item:
          item,

        round:
          selectedRound,

        amount:
          amount

      }

    ],


    members:
      team,


    total:
      total,


    note:
      "",


    timestamp:
      new Date().toISOString()

  };


  console.log(
    "DATA TO WORKER:",
    data
  );


  /*
   * ปิดปุ่มระหว่างบันทึก
   */

  button.disabled =
    true;


  button.textContent =
    "กำลังบันทึก...";


  showMessage(

    "กำลังบันทึกข้อมูล...",

    "info"

  );


  try {


    /*
     * ส่งข้อมูลไป Cloudflare Worker
     */

    const response =
      await fetch(

        WORKER_URL,

        {

          method:
            "POST",


          headers: {

            "Content-Type":
              "application/json"

          },


          body:
            JSON.stringify(
              data
            )

        }

      );


    const result =
      await response.json();


    console.log(
      "WORKER RESPONSE:",
      result
    );


    /*
     * ตรวจผล
     */

    if (
      result &&
      result.success
    ) {


      showMessage(

        "✅ บันทึกข้อมูลเรียบร้อย\n" +

        "รายการ: " +
        item +

        "\nครั้งที่: " +
        selectedRound +

        "\nยอดรวม: " +
        formatMoney(total) +
        " บาท",

        "success"

      );


      /*
       * ล้างฟอร์ม
       */

      resetForm();


    }

    else {


      throw new Error(

        result?.message ||
        "Worker ไม่สามารถบันทึกข้อมูลได้"

      );

    }


  }

  catch (error) {


    console.error(
      "SAVE ERROR:",
      error
    );


    showMessage(

      "❌ บันทึกข้อมูลไม่สำเร็จ\n" +
      (
        error.message ||
        String(error)
      ),

      "error"

    );

  }


  finally {


    button.disabled =
      false;


    button.textContent =
      "💾 บันทึกข้อมูล";

  }

}
