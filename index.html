<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACCOUNT PFA</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 15px 14px 40px;
    }

    .header {
      background: #06c755;
      color: white;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: .95;
    }

    .user-box {
      background: white;
      border-radius: 15px;
      padding: 13px 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .user-name {
      font-weight: bold;
      font-size: 17px;
    }

    .user-status {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
      white-space: pre-line;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 13px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
      white-space: pre-line;
    }

    .message.success {
      display: block;
      background: #e8f7e8;
      color: #187a18;
    }

    .message.error {
      display: block;
      background: #fdeaea;
      color: #c62828;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 19px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #06c755;
    }

    .round-buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .round-btn {
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      padding: 13px 5px;
      font-size: 17px;
      cursor: pointer;
    }

    .round-btn.active {
      background: #06c755;
      color: white;
      border-color: #06c755;
    }

    .member-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .member-btn {
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      padding: 14px 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .member-btn.active {
      background: #06c755;
      color: white;
      border-color: #06c755;
    }

    .member-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .team-member {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }

    .team-member-name {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .team-total {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      font-weight: bold;
    }

    .grand-total {
      background: #111;
      color: white;
      border-radius: 15px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .save-btn {
      width: 100%;
      border: none;
      background: #06c755;
      color: white;
      border-radius: 15px;
      padding: 17px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn:disabled {
      background: #999;
      cursor: wait;
    }

    .clear-btn {
      width: 100%;
      border: 1px solid #ddd;
      background: white;
      border-radius: 15px;
      padding: 14px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 10px;
    }

    .small-note {
      color: #777;
      font-size: 13px;
      margin-top: 7px;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>ACCOUNT PFA</h1>

    <p>บันทึกรายการค่าใช้จ่าย</p>

  </div>


  <!-- USER -->

  <div class="user-box">

    <div
      id="userName"
      class="user-name"
    >
      กำลังเข้าสู่ระบบ LINE...
    </div>

    <div
      id="userStatus"
      class="user-status"
    >
      กรุณารอสักครู่
    </div>

  </div>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- ========================= -->
  <!-- 1 รายการ -->
  <!-- ========================= -->

  <div class="card">

    <div class="section-title">
      1. รายการ
    </div>

    <label for="item">
      รายละเอียดรายการ
    </label>

    <input
      type="text"
      id="item"
      placeholder="เช่น เติมน้ำมันรถ"
      autocomplete="off"
    >

  </div>


  <!-- ========================= -->
  <!-- 2 ครั้งที่ -->
  <!-- ========================= -->

  <div class="card">

    <div class="section-title">
      2. ครั้งที่
    </div>

    <div class="round-buttons">

      <button
        type="button"
        class="round-btn"
        data-round="1"
      >
        ครั้งที่ 1
      </button>

      <button
        type="button"
        class="round-btn"
        data-round="2"
      >
        ครั้งที่ 2
      </button>

      <button
        type="button"
        class="round-btn"
        data-round="3"
      >
        ครั้งที่ 3
      </button>

      <button
        type="button"
        class="round-btn"
        data-round="4"
      >
        ครั้งที่ 4
      </button>

      <button
        type="button"
        class="round-btn"
        data-round="5"
      >
        ครั้งที่ 5
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- 3 จำนวนเงิน -->
  <!-- ========================= -->

  <div class="card">

    <div class="section-title">
      3. จำนวนเงิน
    </div>

    <label for="amount">
      จำนวนเงินหลัก (บาท)
    </label>

    <input
      type="number"
      id="amount"
      placeholder="0.00"
      min="0"
      step="0.01"
      inputmode="decimal"
    >

  </div>


  <!-- ========================= -->
  <!-- 4 สมาชิกทีม -->
  <!-- ========================= -->

  <div class="card">

    <div class="section-title">
      4. ค่าทีม
    </div>

    <div class="small-note">
      เลือกสมาชิกได้สูงสุด 4 คน
    </div>

    <br>

    <div
      id="memberButtons"
      class="member-buttons"
    >

      <div class="loading">
        กำลังโหลดสมาชิก...
      </div>

    </div>

    <div id="teamContainer"></div>

    <div
      id="teamTotal"
      class="team-total"
      style="display:none;"
    >

      <span>
        รวมค่าทีม
      </span>

      <span>
        <span id="teamTotalValue">
          0.00
        </span>
        บาท
      </span>

    </div>

  </div>


  <!-- ========================= -->
  <!-- TOTAL -->
  <!-- ========================= -->

  <div class="grand-total">

    <span>
      รวมทั้งหมด
    </span>

    <span>
      <span id="grandTotal">
        0.00
      </span>
      บาท
    </span>

  </div>


  <!-- ========================= -->
  <!-- SAVE -->
  <!-- ========================= -->

  <button
    id="saveBtn"
    class="save-btn"
    type="button"
  >
    💾 บันทึกข้อมูล
  </button>


  <!-- CLEAR -->

  <button
    id="clearBtn"
    class="clear-btn"
    type="button"
  >
    🗑️ ล้างข้อมูล
  </button>


</div>


<script>


/*************************************************
 * CONFIG
 *************************************************/


const LIFF_ID =
  "2011289699-I5WMsObs";


const WORKER_URL =
  "https://line-accounting-bot.notza1982.workers.dev/";


/*************************************************
 * VARIABLES
 *************************************************/


let lineUser = {

  userId: "",

  name: ""

};


let selectedRound =
  null;


let selectedMembers =
  [];


let memberList =
  [];


/*************************************************
 * MESSAGE
 *************************************************/


function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    "message " + type;

  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/*************************************************
 * FORMAT MONEY
 *************************************************/


function formatMoney(
  value
) {

  return Number(
    value || 0
  ).toLocaleString(

    "th-TH",

    {

      minimumFractionDigits: 2,

      maximumFractionDigits: 2

    }

  );

}


/*************************************************
 * INIT LIFF
 *************************************************/


async function initLIFF() {

  const userName =
    document.getElementById(
      "userName"
    );

  const userStatus =
    document.getElementById(
      "userStatus"
    );

  try {

    userName.textContent =
      "กำลังเข้าสู่ระบบ LINE...";

    userStatus.textContent =
      "กำลังเริ่มต้น LIFF";


    await liff.init({

      liffId:
        LIFF_ID

    });


    /*
     * ถ้ายังไม่ได้ Login
     */

    if (!liff.isLoggedIn()) {

      userStatus.textContent =
        "กำลังเข้าสู่ระบบ...";

      liff.login();

      return;

    }


    /*
     * ดึง Profile
     */

    const profile =
      await liff.getProfile();


    lineUser.userId =
      profile.userId || "";

    lineUser.name =
      profile.displayName || "";


    userName.textContent =
      "👤 " +
      lineUser.name;


    userStatus.textContent =
      "เชื่อมต่อ LINE สำเร็จ";


    /*
     * โหลดสมาชิก
     */

    await loadMembers();

  }

  catch (error) {

    console.error(
      "LIFF ERROR:",
      error
    );

    userName.textContent =
      "❌ ไม่สามารถเชื่อมต่อ LINE";

    userStatus.textContent =
      error.message ||
      String(error);

    showMessage(
      "ไม่สามารถเริ่มต้นระบบ LIFF ได้",
      "error"
    );

  }

}


/*************************************************
 * LOAD MEMBERS
 *************************************************/


async function loadMembers() {

  const container =
    document.getElementById(
      "memberButtons"
    );


  container.innerHTML =
    '<div class="loading">กำลังโหลดสมาชิก...</div>';


  try {

    const response =
      await fetch(

        WORKER_URL +
        "?action=getMembers",

        {

          method: "GET",

          cache: "no-store"

        }

      );


    const result =
      await response.json();


    console.log(
      "MEMBERS:",
      result
    );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(

        result?.message ||
        "โหลดสมาชิกไม่สำเร็จ"

      );

    }


    memberList =
      Array.isArray(
        result.members
      )
        ? result.members
        : [];


    renderMembers();


  }

  catch (error) {

    console.error(
      "LOAD MEMBERS ERROR:",
      error
    );


    container.innerHTML = `

      <div
        style="
          grid-column:1/-1;
          color:#c62828;
          text-align:center;
          padding:10px;
        "
      >
        ❌ โหลดสมาชิกไม่สำเร็จ
      </div>

    `;


    showMessage(

      "ไม่สามารถโหลดรายชื่อสมาชิกได้\n" +
      error.message,

      "error"

    );

  }

}


/*************************************************
 * RENDER MEMBERS
 *************************************************/


function renderMembers() {

  const container =
    document.getElementById(
      "memberButtons"
    );


  container.innerHTML =
    "";


  if (
    memberList.length === 0
  ) {

    container.innerHTML = `

      <div
        style="
          grid-column:1/-1;
          text-align:center;
          color:#777;
          padding:10px;
        "
      >
        ไม่พบสมาชิก
      </div>

    `;

    return;

  }


  memberList.forEach(
    function(member) {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "member-btn";


      button.dataset.memberId =
        member.id;


      button.dataset.memberName =
        member.name;


      button.textContent =
        "👤 " +
        member.name;


      button.addEventListener(
        "click",
        function() {

          toggleMember(
            member,
            button
          );

        }
      );


      container.appendChild(
        button
      );

    }
  );

}


/*************************************************
 * TOGGLE MEMBER
 *************************************************/


function toggleMember(
  member,
  button
) {

  const existingIndex =
    selectedMembers.findIndex(

      function(item) {

        return item.id ===
          member.id;

      }

    );


  /*
   * ยกเลิกสมาชิก
   */

  if (
    existingIndex !== -1
  ) {

    selectedMembers.splice(
      existingIndex,
      1
    );


    button.classList.remove(
      "active"
    );


    const element =
      document.getElementById(
        "team-" +
        member.id
      );


    if (element) {

      element.remove();

    }


    updateMemberButtons();

    updateTotals();

    return;

  }


  /*
   * จำกัด 4 คน
   */

  if (
    selectedMembers.length >= 4
  ) {

    showMessage(

      "เลือกสมาชิกได้สูงสุด 4 คน",

      "error"

    );

    return;

  }


  /*
   * เพิ่มสมาชิก
   */

  selectedMembers.push({

    id:
      member.id,

    name:
      member.name

  });


  button.classList.add(
    "active"
  );


  addTeamMember(
    member
  );


  updateMemberButtons();

  updateTotals();

}


/*************************************************
 * UPDATE MEMBER BUTTONS
 *************************************************/


function updateMemberButtons() {

  document
    .querySelectorAll(
      ".member-btn"
    )
    .forEach(

      function(button) {

        const id =
          button.dataset.memberId;


        if (
          selectedMembers.length >= 4 &&
          !selectedMembers.some(
            function(member) {
              return member.id === id;
            }
          )
        ) {

          button.disabled =
            true;

        }

        else {

          button.disabled =
            false;

        }

      }

    );

}


/*************************************************
 * ADD TEAM MEMBER
 *************************************************/


function addTeamMember(
  member
) {

  const container =
    document.getElementById(
      "teamContainer"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "team-member";


  div.id =
    "team-" +
    member.id;


  div.innerHTML = `

    <div class="team-member-name">
      👤 ${escapeHtml(member.name)}
    </div>

    <input

      type="number"

      class="team-amount"

      data-member-id="${escapeHtml(member.id)}"

      data-member-name="${escapeHtml(member.name)}"

      placeholder="จำนวนเงินของ ${escapeHtml(member.name)}"

      min="0"

      step="0.01"

      inputmode="decimal"

    >

  `;


  container.appendChild(
    div
  );


  div
    .querySelector(
      ".team-amount"
    )
    .addEventListener(

      "input",

      updateTotals

    );

}


/*************************************************
 * ESCAPE HTML
 *************************************************/


function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*************************************************
 * ROUND
 *************************************************/


document
  .querySelectorAll(
    ".round-btn"
  )
  .forEach(

    function(button) {

      button.addEventListener(

        "click",

        function() {

          document
            .querySelectorAll(
              ".round-btn"
            )
            .forEach(

              function(btn) {

                btn.classList.remove(
                  "active"
                );

              }

            );


          button.classList.add(
            "active"
          );


          selectedRound =
            Number(
              button.dataset.round
            );

        }

      );

    }

  );


/*************************************************
 * UPDATE TOTALS
 *************************************************/


function updateTotals() {

  let teamTotal =
    0;


  document
    .querySelectorAll(
      ".team-amount"
    )
    .forEach(

      function(input) {

        teamTotal +=
          Number(
            input.value
          ) || 0;

      }

    );


  const amount =
    Number(

      document
        .getElementById(
          "amount"
        )
        .value

    ) || 0;


  const total =
    amount +
    teamTotal;


  document
    .getElementById(
      "teamTotalValue"
    )
    .textContent =
    formatMoney(
      teamTotal
    );


  document
    .getElementById(
      "grandTotal"
    )
    .textContent =
    formatMoney(
      total
    );


  const teamTotalBox =
    document.getElementById(
      "teamTotal"
    );


  if (
    selectedMembers.length > 0
  ) {

    teamTotalBox.style.display =
      "flex";

  }

  else {

    teamTotalBox.style.display =
      "none";

  }

}


/*************************************************
 * AMOUNT EVENT
 *************************************************/


document
  .getElementById(
    "amount"
  )
  .addEventListener(

    "input",

    updateTotals

  );


/*************************************************
 * SAVE
 *************************************************/


document
  .getElementById(
    "saveBtn"
  )
  .addEventListener(

    "click",

    saveTransaction

  );


async function saveTransaction() {

  const button =
    document.getElementById(
      "saveBtn"
    );


  /*
   * ตรวจ LINE
   */

  if (
    !lineUser.userId
  ) {

    showMessage(

      "กรุณารอให้ LINE Login เสร็จก่อน",

      "error"

    );

    return;

  }


  /*
   * รายการ
   */

  const item =
    document
      .getElementById(
        "item"
      )
      .value
      .trim();


  if (!item) {

    showMessage(

      "กรุณาระบุรายการ",

      "error"

    );

    return;

  }


  /*
   * ครั้งที่
   */

  if (!selectedRound) {

    showMessage(

      "กรุณาเลือกครั้งที่",

      "error"

    );

    return;

  }


  /*
   * จำนวนเงิน
   */

  const amount =
    Number(

      document
        .getElementById(
          "amount"
        )
        .value

    );


  if (
    isNaN(amount) ||
    amount < 0
  ) {

    showMessage(

      "กรุณาระบุจำนวนเงินให้ถูกต้อง",

      "error"

    );

    return;

  }


  /*
   * สมาชิกทีม
   */

  const team = [];


  document
    .querySelectorAll(
      ".team-amount"
    )
    .forEach(

      function(input) {

        const memberAmount =
          Number(
            input.value
          ) || 0;


        team.push({

          id:
            input.dataset.memberId,

          name:
            input.dataset.memberName,

          amount:
            memberAmount

        });

      }

    );


  /*
   * รวมค่าทีม
   */

  let teamTotal =
    0;


  team.forEach(

    function(member) {

      teamTotal +=
        Number(
          member.amount
        ) || 0;

    }

  );


  /*
   * ยอดรวม
   */

  const total =
    amount +
    teamTotal;


  /*
   * DATA
   */

  const data = {

    type:
      "LIFF_EXPENSE",

    userId:
      lineUser.userId,

    displayName:
      lineUser.name,

    item:
      item,

    round:
      selectedRound,

    amount:
      amount,

    team:
      team,

    expenses: [

      {

        item:
          item,

        round:
          selectedRound,

        amount:
          amount

      }

    ],

    total:
      total,

    timestamp:
      new Date().toISOString()

  };


  console.log(
    "SAVE DATA:",
    data
  );


  /*
   * ปุ่ม Loading
   */

  button.disabled =
    true;

  button.textContent =
    "กำลังบันทึก...";


  try {

    /*
     * ส่งไป Cloudflare Worker
     */

    const response =
      await fetch(

        WORKER_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              data
            )

        }

      );


    const result =
      await response.json();


    console.log(
      "SAVE RESULT:",
      result
    );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(

        result?.message ||
        "ไม่สามารถบันทึกข้อมูลได้"

      );

    }


    /*
     * สำเร็จ
     */

    showMessage(

      "✅ บันทึกข้อมูลเรียบร้อย\n" +
      "ครั้งที่ " +
      selectedRound +
      "\n" +
      "ยอดรวม " +
      formatMoney(total) +
      " บาท",

      "success"

    );


    /*
     * Reset
     */

    resetForm();


  }

  catch (error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    showMessage(

      "❌ บันทึกข้อมูลไม่สำเร็จ\n" +
      error.message,

      "error"

    );

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "💾 บันทึกข้อมูล";

  }

}


/*************************************************
 * RESET FORM
 *************************************************/


function resetForm() {

  document
    .getElementById(
      "item"
    )
    .value =
    "";


  document
    .getElementById(
      "amount"
    )
    .value =
    "";


  selectedRound =
    null;


  selectedMembers =
    [];


  document
    .querySelectorAll(
      ".round-btn"
    )
    .forEach(

      function(button) {

        button.classList.remove(
          "active"
        );

      }

    );


  document
    .querySelectorAll(
      ".member-btn"
    )
    .forEach(

      function(button) {

        button.classList.remove(
          "active"
        );

        button.disabled =
          false;

      }

    );


  document
    .getElementById(
      "teamContainer"
    )
    .innerHTML =
    "";


  updateTotals();

}


/*************************************************
 * CLEAR
 *************************************************/


document
  .getElementById(
    "clearBtn"
  )
  .addEventListener(

    "click",

    function() {

      if (

        confirm(
          "ต้องการล้างข้อมูลทั้งหมดหรือไม่?"
        )

      ) {

        resetForm();


        showMessage(

          "ล้างข้อมูลแล้ว",

          "success"

        );

      }

    }

  );


/*************************************************
 * START
 *************************************************/


updateTotals();

initLIFF();


</script>
