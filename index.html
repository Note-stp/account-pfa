<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ACCOUNT PFA</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 5px 0 0;
      color: #777;
      font-size: 14px;
    }

    .user-box {
      background: white;
      border-radius: 15px;
      padding: 13px 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .user-name {
      font-weight: bold;
      font-size: 17px;
    }

    .user-status {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
      white-space: pre-line;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    .round-buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .round-btn {
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      padding: 13px 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .round-btn.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    .member-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .member-btn {
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      cursor: pointer;
    }

    .member-btn.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    .team-member {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }

    .team-member-name {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .team-total {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      font-weight: bold;
    }

    .grand-total {
      background: #111;
      color: white;
      border-radius: 15px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .save-btn {
      width: 100%;
      border: none;
      background: #06c755;
      color: white;
      border-radius: 15px;
      padding: 17px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn:disabled {
      background: #999;
    }

    .clear-btn {
      width: 100%;
      border: 1px solid #ddd;
      background: white;
      border-radius: 15px;
      padding: 14px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
      white-space: pre-line;
    }

    .message.success {
      display: block;
      background: #e8f7e8;
      color: #187a18;
    }

    .message.error {
      display: block;
      background: #fdeaea;
      color: #c62828;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 10px;
    }

    .small-note {
      color: #777;
      font-size: 13px;
      margin-top: 7px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>ACCOUNT PFA</h1>
    <p>บันทึกรายการค่าใช้จ่าย</p>
  </div>

  <div class="user-box">
    <div id="userName" class="user-name">
      กำลังเข้าสู่ระบบ LINE...
    </div>

    <div id="userStatus" class="user-status">
      กรุณารอสักครู่
    </div>
  </div>

  <div id="message" class="message"></div>


  <!-- ==============================
       1. รายการ
       ============================== -->

  <div class="card">

    <div class="section-title">
      1. รายการ
    </div>

    <label>
      รายละเอียดรายการ
    </label>

    <input
      type="text"
      id="item"
      placeholder="เช่น ค่าน้ำมัน"
      autocomplete="off"
    >

  </div>


  <!-- ==============================
       2. ครั้งที่
       ============================== -->

  <div class="card">

    <div class="section-title">
      2. ครั้งที่
    </div>

    <div class="round-buttons">

      <button
        type="button"
        class="round-btn"
        data-round="1">
        ครั้งที่ 1
      </button>

      <button
        type="button"
        class="round-btn"
        data-round="2">
        ครั้งที่ 2
      </button>

      <button
        type="button"
        class="round-btn"
        data-round="3">
        ครั้งที่ 3
      </button>

      <button
        type="button"
        class="round-btn"
        data-round="4">
        ครั้งที่ 4
      </button>

      <button
        type="button"
        class="round-btn"
        data-round="5">
        ครั้งที่ 5
      </button>

    </div>

    <div class="small-note">
      กรุณาเลือกครั้งที่ก่อนบันทึก
    </div>

  </div>


  <!-- ==============================
       3. จำนวนเงิน
       ============================== -->

  <div class="card">

    <div class="section-title">
      3. จำนวนเงิน
    </div>

    <label>
      จำนวนเงินหลัก (บาท)
    </label>

    <input
      type="number"
      id="amount"
      placeholder="0.00"
      min="0"
      step="0.01"
      inputmode="decimal"
    >

  </div>


  <!-- ==============================
       4. สมาชิกทีม
       ============================== -->

  <div class="card">

    <div class="section-title">
      4. ค่าทีม
    </div>

    <div class="small-note">
      เลือกสมาชิกได้สูงสุด 4 คน
    </div>

    <br>

    <div
      id="memberButtons"
      class="member-buttons">

      <div class="loading">
        กำลังโหลดสมาชิก...
      </div>

    </div>

    <div id="teamContainer"></div>

    <div
      id="teamTotal"
      class="team-total"
      style="display:none;">

      <span>
        รวมค่าทีม
      </span>

      <span>
        <span id="teamTotalValue">0.00</span>
        บาท
      </span>

    </div>

  </div>


  <!-- ==============================
       5. TOTAL
       ============================== -->

  <div class="grand-total">

    <span>
      รวมทั้งหมด
    </span>

    <span>
      <span id="grandTotal">0.00</span>
      บาท
    </span>

  </div>


  <!-- ==============================
       SAVE
       ============================== -->

  <button
    id="saveBtn"
    class="save-btn"
    type="button">

    💾 บันทึกข้อมูล

  </button>


  <!-- ==============================
       CLEAR
       ============================== -->

  <button
    id="clearBtn"
    class="clear-btn"
    type="button">

    🗑️ ล้างข้อมูล

  </button>

</div>


<script>

/*************************************************
 * CONFIG
 *************************************************/

const LIFF_ID =
  "2011289699-I5WMsObs";

const WORKER_URL =
  "https://line-accounting-bot.notza1982.workers.dev";


/*************************************************
 * VARIABLES
 *************************************************/

let lineUser = {
  userId: "",
  name: ""
};

let selectedRound = null;

let selectedMembers = [];

let memberList = [];


/*************************************************
 * MESSAGE
 *************************************************/

function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/*************************************************
 * FORMAT MONEY
 *************************************************/

function formatMoney(value) {

  return Number(value || 0).toLocaleString(
    "th-TH",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );

}


/*************************************************
 * LIFF INIT
 *************************************************/

async function initLIFF() {

  const nameBox =
    document.getElementById("userName");

  const statusBox =
    document.getElementById("userStatus");

  try {

    statusBox.textContent =
      "กำลังเริ่มต้น LINE...";

    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * ถ้าเปิดใน LINE
     */

    if (
      liff.isLoggedIn()
    ) {

      const profile =
        await liff.getProfile();

      lineUser.userId =
        profile.userId || "";

      lineUser.name =
        profile.displayName || "";

      nameBox.textContent =
        "👤 " + lineUser.name;

      statusBox.textContent =
        "เชื่อมต่อ LINE สำเร็จ";

    }

    else {

      /*
       * กรณีเปิดนอก LINE
       */

      nameBox.textContent =
        "ACCOUNT PFA";

      statusBox.textContent =
        "กรุณาเข้าสู่ระบบ LINE";

      /*
       * Login
       */

      liff.login();

      return;

    }


    /*
     * โหลดสมาชิก
     */

    await loadMembers();

  }

  catch (error) {

    console.error(
      "LIFF ERROR:",
      error
    );

    nameBox.textContent =
      "❌ ไม่สามารถเชื่อมต่อ LINE";

    statusBox.textContent =
      error.message ||
      String(error);

  }

}


/*************************************************
 * LOAD MEMBERS
 *************************************************/

async function loadMembers() {

  const container =
    document.getElementById(
      "memberButtons"
    );

  container.innerHTML =
    '<div class="loading">กำลังโหลดสมาชิก...</div>';

  try {

    const response =
      await fetch(
        WORKER_URL +
        "?action=getMembers",
        {
          method: "GET"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Worker ตอบกลับ HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "MEMBERS:",
      result
    );


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "ไม่สามารถโหลดสมาชิก"
      );

    }


    memberList =
      Array.isArray(result.members)
        ? result.members
        : [];


    container.innerHTML = "";


    if (
      memberList.length === 0
    ) {

      container.innerHTML =
        '<div class="loading">ไม่พบสมาชิก</div>';

      return;

    }


    memberList
      .slice(0, 4)
      .forEach(function(member) {

        const button =
          document.createElement(
            "button"
          );

        button.type =
          "button";

        button.className =
          "member-btn";

        button.dataset.memberId =
          member.id;

        button.dataset.memberName =
          member.name;

        button.textContent =
          "👤 " + member.name;


        button.addEventListener(
          "click",
          function() {

            toggleMember(
              member,
              button
            );

          }
        );


        container.appendChild(
          button
        );

      });

  }

  catch (error) {

    console.error(
      "LOAD MEMBERS ERROR:",
      error
    );

    container.innerHTML =
      '<div class="loading">❌ โหลดสมาชิกไม่สำเร็จ</div>';

    showMessage(
      "ไม่สามารถโหลดรายชื่อสมาชิกได้\n" +
      error.message,
      "error"
    );

  }

}


/*************************************************
 * TOGGLE MEMBER
 *************************************************/

function toggleMember(
  member,
  button
) {

  const existing =
    selectedMembers.find(
      function(item) {
        return item.id === member.id;
      }
    );


  /*
   * เอาออก
   */

  if (existing) {

    selectedMembers =
      selectedMembers.filter(
        function(item) {
          return item.id !== member.id;
        }
      );

    button.classList.remove(
      "active"
    );

    const element =
      document.getElementById(
        "team-" + member.id
      );

    if (element) {
      element.remove();
    }

    updateTotals();

    return;

  }


  /*
   * จำกัด 4 คน
   */

  if (
    selectedMembers.length >= 4
  ) {

    showMessage(
      "เลือกสมาชิกได้สูงสุด 4 คน",
      "error"
    );

    return;

  }


  /*
   * เพิ่มสมาชิก
   */

  selectedMembers.push({

    id:
      member.id,

    name:
      member.name,

    amount:
      0

  });


  button.classList.add(
    "active"
  );


  addTeamMember(
    member
  );


  updateTotals();

}


/*************************************************
 * ADD TEAM MEMBER
 *************************************************/

function addTeamMember(
  member
) {

  const container =
    document.getElementById(
      "teamContainer"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "team-member";


  div.id =
    "team-" + member.id;


  div.innerHTML = `

    <div class="team-member-name">
      👤 ${escapeHtml(member.name)}
    </div>

    <input
      type="number"
      class="team-amount"
      data-member-id="${escapeHtml(member.id)}"
      data-member-name="${escapeHtml(member.name)}"
      placeholder="จำนวนเงินของ ${escapeHtml(member.name)}"
      min="0"
      step="0.01"
      inputmode="decimal"
    >

  `;


  container.appendChild(
    div
  );


  const input =
    div.querySelector(
      ".team-amount"
    );


  input.addEventListener(
    "input",
    function() {

      const found =
        selectedMembers.find(
          function(item) {
            return item.id === member.id;
          }
        );

      if (found) {
        found.amount =
          Number(input.value) || 0;
      }

      updateTotals();

    }
  );

}


/*************************************************
 * ESCAPE HTML
 *************************************************/

function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/*************************************************
 * ROUND
 *************************************************/

document
  .querySelectorAll(".round-btn")
  .forEach(function(button) {

    button.addEventListener(
      "click",
      function() {

        document
          .querySelectorAll(".round-btn")
          .forEach(
            function(btn) {

              btn.classList.remove(
                "active"
              );

            }
          );


        button.classList.add(
          "active"
        );


        selectedRound =
          Number(
            button.dataset.round
          );

      }
    );

  });


/*************************************************
 * TOTAL
 *************************************************/

function updateTotals() {

  let teamTotal = 0;


  selectedMembers.forEach(
    function(member) {

      teamTotal +=
        Number(member.amount) || 0;

    }
  );


  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    ) || 0;


  const total =
    amount + teamTotal;


  document.getElementById(
    "teamTotalValue"
  ).textContent =
    formatMoney(teamTotal);


  document.getElementById(
    "grandTotal"
  ).textContent =
    formatMoney(total);


  const teamBox =
    document.getElementById(
      "teamTotal"
    );


  if (
    selectedMembers.length > 0
  ) {

    teamBox.style.display =
      "flex";

  }

  else {

    teamBox.style.display =
      "none";

  }

}


/*************************************************
 * AMOUNT EVENT
 *************************************************/

document
  .getElementById("amount")
  .addEventListener(
    "input",
    updateTotals
  );


/*************************************************
 * SAVE
 *************************************************/

document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    saveTransaction
  );


async function saveTransaction() {

  const item =
    document
      .getElementById("item")
      .value
      .trim();


  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  /*
   * ตรวจ LINE
   */

  if (!lineUser.userId) {

    showMessage(
      "กรุณารอให้ LINE Login เสร็จก่อน",
      "error"
    );

    return;

  }


  /*
   * ตรวจรายการ
   */

  if (!item) {

    showMessage(
      "กรุณาระบุรายการ",
      "error"
    );

    return;

  }


  /*
   * ตรวจครั้งที่
   */

  if (!selectedRound) {

    showMessage(
      "กรุณาเลือกครั้งที่",
      "error"
    );

    return;

  }


  /*
   * ตรวจจำนวนเงิน
   */

  if (
    isNaN(amount) ||
    amount < 0
  ) {

    showMessage(
      "กรุณาระบุจำนวนเงินให้ถูกต้อง",
      "error"
    );

    return;

  }


  /*
   * สร้าง Team
   */

  const team =
    selectedMembers.map(
      function(member) {

        return {

          id:
            member.id,

          name:
            member.name,

          amount:
            Number(
              member.amount
            ) || 0

        };

      }
    );


  /*
   * คำนวณยอดรวม
   */

  let teamTotal = 0;

  team.forEach(
    function(member) {

      teamTotal +=
        Number(member.amount) || 0;

    }
  );


  const total =
    amount + teamTotal;


  /*
   * DATA
   */

  const data = {

    type:
      "LIFF_EXPENSE",

    userId:
      lineUser.userId,

    displayName:
      lineUser.name,

    item:
      item,

    round:
      selectedRound,

    amount:
      amount,

    expenses: [

      {

        item:
          item,

        round:
          selectedRound,

        amount:
          amount

      }

    ],

    members:
      team,

    total:
      total,

    timestamp:
      new Date().toISOString()

  };


  console.log(
    "SEND DATA:",
    data
  );


  const button =
    document.getElementById(
      "saveBtn"
    );


  button.disabled =
    true;

  button.textContent =
    "กำลังบันทึก...";


  try {

    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(data)

        }
      );


    const result =
      await response.json();


    console.log(
      "SAVE RESULT:",
      result
    );


    if (
      result &&
      result.success
    ) {

      showMessage(
        "✅ บันทึกข้อมูลเรียบร้อย\n" +
        "ครั้งที่ " +
        selectedRound +
        "\n" +
        "ยอดรวม " +
        formatMoney(total) +
        " บาท",
        "success"
      );


      /*
       * ส่งข้อมูลสำเร็จ
       */

      resetForm();


      /*
       * ถ้าอยู่ใน LINE
       * สามารถปิด LIFF ได้
       */

      /*
      if (liff.isInClient()) {
        setTimeout(function() {
          liff.closeWindow();
        }, 1500);
      }
      */

    }

    else {

      throw new Error(
        result.message ||
        "ไม่สามารถบันทึกข้อมูลได้"
      );

    }

  }

  catch (error) {

    console.error(
      "SAVE ERROR:",
      error
    );

    showMessage(
      "❌ บันทึกไม่สำเร็จ\n" +
      error.message,
      "error"
    );

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "💾 บันทึกข้อมูล";

  }

}


/*************************************************
 * RESET FORM
 *************************************************/

function resetForm() {

  document.getElementById(
    "item"
  ).value = "";


  document.getElementById(
    "amount"
  ).value = "";


  selectedRound =
    null;


  selectedMembers =
    [];


  document
    .querySelectorAll(".round-btn")
    .forEach(
      function(button) {

        button.classList.remove(
          "active"
        );

      }
    );


  document
    .querySelectorAll(".member-btn")
    .forEach(
      function(button) {

        button.classList.remove(
          "active"
        );

      }
    );


  document.getElementById(
    "teamContainer"
  ).innerHTML = "";


  updateTotals();

}


/*************************************************
 * CLEAR
 *************************************************/

document
  .getElementById("clearBtn")
  .addEventListener(
    "click",
    function() {

      if (
        confirm(
          "ต้องการล้างข้อมูลทั้งหมดหรือไม่?"
        )
      ) {

        resetForm();

        showMessage(
          "ล้างข้อมูลแล้ว",
          "success"
        );

      }

    }
  );


/*************************************************
 * START
 *************************************************/

updateTotals();
